[package]
name = "layera-space"
version = "0.1.0"
description = "Layera Space - one workspace for every coding agent"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "layera_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is required for child webviews (the browser preview pane).
# Without it tauri's create_webview command returns UnstableFeatureNotSupported.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
shared_child = "1"
walkdir = "2"
regex = "1"

